name: Build and Test

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  QT_VERSION: "6.6"
  CMAKE_GENERATOR: "Ninja"

jobs:
  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          host: windows
          arch: win64_msvc2019_64
          cache: true

      - name: Install CMake, Ninja, SQLite3
        run: |
          choco install cmake ninja sqlite --no-progress -y
          refreshenv

      - name: Install Protobuf via vcpkg
        run: |
          vcpkg install protobuf:x64-windows sqlitecpp:x64-windows
          refreshenv

      - name: Download srslist.h
        run: |
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          copy srslist.h src\configs\srslist.h

      - name: Configure (MSVC)
        shell: cmd
        run: |
          cmake -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%;C:/Program Files/vcpkg/installed/x64-windows" ^
            -B build

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests
        shell: cmd
        run: |
          cd build
          ctest --output-on-failure --parallel 2

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coredeck-windows-${{ github.run_id }}
          path: build/*.exe
          retention-days: 7

  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            qt6-base-dev qt6-tools-dev \
            libsqlite3-dev \
            protobuf-compiler libprotobuf-dev \
            libssl-dev \
            libxcb-xkb-dev

      - name: Download srslist.h
        run: |
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cp srslist.h src/configs/srslist.h

      - name: Configure (GCC)
        run: |
          cmake -G "${{ env.CMAKE_GENERATOR }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --parallel 2

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coredeck-linux-${{ github.run_id }}
          path: build/CoreDeck
          retention-days: 7

  build-linux-clang:
    name: Linux (Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang \
            qt6-base-dev qt6-tools-dev \
            libsqlite3-dev \
            protobuf-compiler libprotobuf-dev \
            libssl-dev \
            libxcb-xkb-dev

      - name: Download srslist.h
        run: |
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cp srslist.h src/configs/srslist.h

      - name: Configure (Clang)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -G "${{ env.CMAKE_GENERATOR }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --parallel 2

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coredeck-linux-clang-${{ github.run_id }}
          path: build/CoreDeck
          retention-days: 7